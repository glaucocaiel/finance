{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold"><i class="bi bi-arrow-down-circle text-success me-2"></i>Entradas</h4>
  <a href="{{ url_for('nova_entrada') }}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Nova Entrada</a>
</div>
<div class="card">
  <table class="table table-hover mb-0">
    <thead><tr><th>Data</th><th>Origem</th><th class="text-end">Valor</th><th>Obs</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    {% for e in entradas %}
    <tr>
      <td>{{ e.data.strftime("%d/%m/%Y") }}</td>
      <td>{{ e.origem }}</td>
      <td class="text-end fw-semibold text-success">R$ {{ "%.2f"|format(e.valor) }}</td>
      <td><small class="text-muted">{{ e.obs or "" }}</small></td>
      <td class="text-end">
        <a href="{{ url_for('excluir_entrada', id=e.id) }}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Excluir entrada?')"><i class="bi bi-trash"></i></a>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="text-center text-muted py-4">Nenhuma entrada registrada.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
