{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold"><i class="bi bi-list-ul me-2"></i>Contas</h4>
  <a href="{{ url_for('nova_conta') }}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova Conta</a>
</div>
<div class="card">
  <table class="table table-hover mb-0">
    <thead><tr><th>Código</th><th>Descrição</th><th>Grupo</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    {% for c in contas %}
    <tr>
      <td><span class="badge bg-primary">{{ c.codigo }}</span></td>
      <td>{{ c.descricao }}</td>
      <td><span class="badge bg-secondary">{{ c.grupo.nome }}</span></td>
      <td class="text-end">
        <a href="{{ url_for('editar_conta', id=c.id) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
        <a href="{{ url_for('excluir_conta', id=c.id) }}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Excluir conta?')"><i class="bi bi-trash"></i></a>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted py-4">Nenhuma conta cadastrada.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
