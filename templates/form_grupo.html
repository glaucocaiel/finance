{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-folder2 me-2"></i>{{ "Editar" if grupo else "Novo" }} Grupo</h4>
<div class="card p-4" style="max-width:450px">
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Nome do Grupo</label>
      <input type="text" name="nome" class="form-control" value="{{ grupo.nome if grupo else '' }}" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Salvar</button>
      <a href="{{ url_for('grupos') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
