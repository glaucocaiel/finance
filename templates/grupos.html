{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold"><i class="bi bi-folder2 me-2"></i>Grupos</h4>
  <a href="{{ url_for('novo_grupo') }}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo Grupo</a>
</div>
<div class="card">
  <table class="table table-hover mb-0">
    <thead><tr><th>#</th><th>Nome</th><th>Contas</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    {% for g in grupos %}
    <tr>
      <td>{{ g.id }}</td>
      <td>{{ g.nome }}</td>
      <td><span class="badge bg-secondary">{{ g.contas|length }}</span></td>
      <td class="text-end">
        <a href="{{ url_for('editar_grupo', id=g.id) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
        <a href="{{ url_for('excluir_grupo', id=g.id) }}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Excluir grupo?')"><i class="bi bi-trash"></i></a>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted py-4">Nenhum grupo cadastrado.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
