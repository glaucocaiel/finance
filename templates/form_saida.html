{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-arrow-up-circle text-danger me-2"></i>Nova Saída</h4>
<div class="card p-4" style="max-width:520px">
  <form method="post" id="formSaida">
    <div class="mb-3">
      <label class="form-label fw-semibold">Data</label>
      <input type="date" name="data" class="form-control" value="{{ hoje }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Conta</label>
      <input type="text" id="buscaConta" class="form-control" placeholder="Digite para pesquisar conta..." autocomplete="off">
      <input type="hidden" name="conta_id" id="contaId" required>
      <div id="sugestoes" class="list-group position-absolute" style="z-index:999;max-width:460px"></div>
      <div id="contaSelecionada" class="mt-1 text-success small"></div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Valor (R$)</label>
      <input type="number" name="valor" class="form-control" step="0.01" min="0.01" placeholder="0,00" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Observação <span class="text-muted">(opcional)</span></label>
      <input type="text" name="obs" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-danger">Registrar</button>
      <a href="{{ url_for('saidas') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const busca = document.getElementById("buscaConta");
const sugestoes = document.getElementById("sugestoes");
const contaId = document.getElementById("contaId");
const contaSel = document.getElementById("contaSelecionada");

busca.addEventListener("input", async () => {
  const q = busca.value.trim();
  if (q.length < 1) { sugestoes.innerHTML = ""; return; }
  const res = await fetch(`/api/contas?q=${encodeURIComponent(q)}`);
  const data = await res.json();
  sugestoes.innerHTML = data.map(c =>
    `<button type="button" class="list-group-item list-group-item-action" onclick="selecionarConta(${c.id}, '${c.text.replace(/'/g,"\'")}')">
      ${c.text}</button>`
  ).join("");
});

function selecionarConta(id, texto) {
  contaId.value = id;
  busca.value = texto;
  contaSel.textContent = "✓ " + texto;
  sugestoes.innerHTML = "";
}

document.addEventListener("click", e => {
  if (!e.target.closest("#sugestoes") && e.target !== busca) sugestoes.innerHTML = "";
});
</script>
{% endblock %}
