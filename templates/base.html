<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>💰 Finanças Pessoais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .sidebar { min-height: 100vh; background: linear-gradient(180deg, #1a237e 0%, #283593 100%); }
    .sidebar .nav-link { color: rgba(255,255,255,.75); border-radius: 8px; margin: 2px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,.15); color: #fff; }
    .sidebar .nav-link i { margin-right: 8px; }
    .sidebar-brand { color: #fff; font-size: 1.2rem; font-weight: 700; padding: 1.2rem; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .card-stat { border-left: 4px solid; }
    .badge-grupo { font-size: .75rem; }
    .table thead th { background: #e8eaf6; color: #1a237e; border: none; }
    .btn-primary { background: #1a237e; border-color: #1a237e; }
    .btn-primary:hover { background: #283593; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-auto col-md-2 sidebar px-0 py-3">
      <div class="sidebar-brand"><i class="bi bi-cash-coin"></i> Finanças</div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item mt-2">
          <span class="text-white-50 px-3" style="font-size:.75rem;text-transform:uppercase">Cadastros</span>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'grupo' in request.endpoint %}active{% endif %}" href="{{ url_for('grupos') }}">
            <i class="bi bi-folder2"></i> Grupos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'conta' in request.endpoint %}active{% endif %}" href="{{ url_for('contas') }}">
            <i class="bi bi-list-ul"></i> Contas
          </a>
        </li>
        <li class="nav-item mt-2">
          <span class="text-white-50 px-3" style="font-size:.75rem;text-transform:uppercase">Lançamentos</span>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'entrada' in request.endpoint %}active{% endif %}" href="{{ url_for('entradas') }}">
            <i class="bi bi-arrow-down-circle text-success"></i> Entradas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'saida' in request.endpoint %}active{% endif %}" href="{{ url_for('saidas') }}">
            <i class="bi bi-arrow-up-circle text-danger"></i> Saídas
          </a>
        </li>
      </ul>
    </div>

    <!-- Main -->
    <div class="col py-4 px-4">
      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in msgs %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
