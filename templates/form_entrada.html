{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-arrow-down-circle text-success me-2"></i>Nova Entrada</h4>
<div class="card p-4" style="max-width:480px">
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Data</label>
      <input type="date" name="data" class="form-control" value="{{ hoje }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Valor (R$)</label>
      <input type="number" name="valor" class="form-control" step="0.01" min="0.01" placeholder="0,00" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Origem</label>
      <input type="text" name="origem" class="form-control" placeholder="Ex: Salário, Freelance..." required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Observação <span class="text-muted">(opcional)</span></label>
      <input type="text" name="obs" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success">Registrar</button>
      <a href="{{ url_for('entradas') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
